<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cursach-production.up.railway.app; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://cursach-production.up.railway.app; img-src 'self' data: https://arisnowie97.github.io; style-src 'self' 'unsafe-inline';">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreelancePlatform.Client</title>
    <base href="/Cursach/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FreelancePlatform.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        404 Error: Page not found.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <link rel="stylesheet" href="style.css" />
    <script>
        // Сохраняем путь, на который хотел зайти пользователь
        var path = window.location.pathname;
        // Перенаправляем на index.html, но с параметром path
        window.location.replace('/Cursach/' + '?path=' + path.replace('/Cursach/', ''));
    </script>
</body>

</html>
